[workspace]
resolver = "2"
members = ["crates/pwm-core", "crates/pwmd", "crates/pwm-cli", "crates/pwm-tui", "crates/cqds-delegation-smoke"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://example.invalid/pwm"

[workspace.lints.clippy]
# Style gates aligned with clippy.toml + docs/AGENT_PROMPT_coding.md
too_many_arguments = "warn"
too_many_lines = "warn"
cognitive_complexity = "warn"
module_inception = "warn"
items_after_test_module = "warn"

# release profile: keep arithmetic overflow traps enabled for safety-critical code
[profile.release]
overflow-checks = true

# flamegraph profile: release-speed + debug symbols for samply/perf
[profile.flamegraph]
inherits = "release"
debug = true

[workspace.dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
ratatui = "0.26.3"
crossterm = "0.27"
hex = "0.4"
bech32 = "0.9"
