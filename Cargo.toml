[workspace]
resolver = "2"
members = ["crates/pwm-core", "crates/pwmd", "crates/pwm-cli", "crates/pwm-tui"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://example.invalid/pwm"

[workspace.dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
ratatui = "0.26.3"
crossterm = "0.27"
hex = "0.4"
bech32 = "0.9"
