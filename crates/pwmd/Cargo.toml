[package]
name = "pwmd"
version = "0.1.53"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "pwmd"
path = "src/main.rs"

[[bin]]
name = "pwmd-ch-snap-import"
path = "src/bin/ch_snap_import.rs"
required-features = ["clickhouse-snapshot"]

[[bin]]
name = "pwmd-snap-repair"
path = "src/bin/pwmd_snap_repair.rs"

[[bin]]
name = "pwmd_lease_probe"
path = "src/bin/pwmd_lease_probe.rs"

[features]
default = []
clickhouse-snapshot = []

[dependencies]
pwm-core = { path = "../pwm-core" }
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest = { workspace = true }
tower-http = { version = "0.5", features = ["cors"] }
clap.workspace = true
slip10_ed25519 = "0.1.3"
ed25519-dalek.workspace = true
rpassword = "7"
url = "2"
fs2 = "0.4.3"
serde_yaml = "0.9"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serde_json.workspace = true
tower = { version = "0.5", features = ["util"] }
reqwest = { workspace = true }

[[bench]]
name = "snapshot_load"
harness = false
