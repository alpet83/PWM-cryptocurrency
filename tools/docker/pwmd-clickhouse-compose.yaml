# Local ClickHouse for pwmd snapshot prototype (HTTP :8123).

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ch_pwm_data:/var/lib/clickhouse
      - ./sql/clickhouse_pwm_snapshots.ddl:/docker-entrypoint-initdb.d/01-pwm-snapshots.sql:ro

volumes:
  ch_pwm_data:
