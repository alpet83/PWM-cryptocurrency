[package]
name = "pwm-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "pwm"
path = "src/main.rs"

# Small harness helper for the V5-8 operator smoke (ClaimIPv4Batch happy path).
# Not intended as a user-facing CLI command.
[[bin]]
name = "claim-ipv4-batch"
path = "src/bin/claim_ipv4_batch.rs"

[lib]
name = "pwm_cli"
path = "src/lib.rs"

[dependencies]
pwm-core = { path = "../pwm-core" }
clap.workspace = true
hex.workspace = true
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde_json.workspace = true
serde.workspace = true
serde_yaml = "0.9"
base64 = "0.22"
rand.workspace = true
slip10_ed25519 = "0.1.3"
ed25519-dalek.workspace = true
rpassword = "7"
