[ignore]
dirs = [
  ".git",
  ".cursor",
  ".idea",
  ".cqds",
  ".grok",
  ".git_hub",
  ".kilo",  
  "__pycache__",
  ".pytest_cache",
  ".mypy_cache",
  ".ruff_cache",
  ".tox",
  ".venv",
  "logs",
  "node_modules",
  "target",
  "target_verify",
  "target-codex",
  "debug",
  "tmp",
  ".tmp-test",
]
file_patterns = [
  "*.pyc",
  "*.pyo",
  "*.log",
  "*.sqlite",
  "*.jsonl",
  "*.lock",
  "ra.ps1",
  "NUL",
  "tmp_*",
  "commit_prepare_report.json",
  "**/commit_prepare_report.json",
  "docs/mcp_index*",
  ".rustc_info.json",
]

[scan]
text_extensions = [
  ".rs", ".toml", ".md", ".txt", ".json", ".yaml", ".yml", ".sh",
]

[commit]
public_repo = "P:/GitHub/pwm-protocol"

[[mappings]]
name = "pwm_main"
src = "{target_dir}"
dst = "P:/GitHub/pwm-protocol"
exclude_globs = [
  "target/**",
  "target_verify/**",
  "target-codex/**",
  "debug/**",
  "tmp/**",
  ".tmp-test/**",
  "logs/**",
  "state/**",
  ".cqds/**",
  ".cqds_mcp_active.pid",
  ".grok/**",
  "/build.rs",
  "MANIFEST.txt",
  "NUL",
  ".rustc_info.json",
  ".mcp.json",
  "litellm_config.yaml",
  "start_comp.cmd",
  "codex.log",
  "commit_prepare_report.json",
  "**/commit_prepare_report.json",
  "docs/CONCEPT_ROADMAP.md",
  "docs/mcp_index*",
  ".cursor/**",
  ".idea/**",
]
